name: Deploy-api-dev

on:
  push:
    branches: [develop]

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      ocir_repository: airbnb-dev/airbnb-server
      dockerfile: Dockerfile
    secrets:
      OCIR_TOKEN: ${{ secrets.OCIR_TOKEN }}
      OCIR_USERNAME: ${{ secrets.OCIR_USERNAME }}
